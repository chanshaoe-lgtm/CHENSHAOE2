[env:esp32-s3-devkitc-1]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
platform_packages =
    framework-arduinoespressif32@3.20016.200129
framework = arduino
monitor_speed = 115200
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    mathertel/OneButton@^2.5.0
    ESP32Servo@^3.0.0
    bitbank2/JPEGDEC@^1.2.8
build_flags = 
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=272
    -D TFT_CS=10
    -D TFT_DC=7
    -D TFT_RST=6
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_MISO=13
    -D TOUCH_CS=16
    -D TFT_SPI_PORT=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D JPEGDEC_NO_FILE_FUNCTIONS=1
    -D FS_H=1
    -I include/
    -I .
build_src_filter = 
    +<*>
    -<.git/>
    -<.svn/>

